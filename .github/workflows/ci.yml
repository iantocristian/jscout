name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run tests
        run: cargo test --all-targets --all-features
      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - name: Install pinned gateway dependencies
        run: npm ci --prefix gateway
      - name: Run gateway tests
        run: npm test --prefix gateway

  checker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: checker/package-lock.json
      - name: Install pinned checker dependencies
        run: npm ci --prefix checker
      - name: Run checker tests
        run: npm test --prefix checker

  performance-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
      - name: Run performance harness tests
        run: node --test bench/perf/perf.test.mjs

  release-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: gateway/package-lock.json
      - name: Build self-contained release archive
        run: scripts/package-release.sh
      - name: Validate npm launcher and package assembly
        run: |
          node --test npm/cli/test/launcher.test.mjs
          node scripts/npm-package.mjs
          npm pack --dry-run target/npm/cli
          npm pack --dry-run target/npm/linux-x64-gnu
          # Only ever run during a release, so a syntax error in it would
          # otherwise surface at the worst possible moment.
          node --check scripts/npm-bootstrap-publish.mjs
      - name: Smoke-test outside the checkout
        shell: bash
        run: |
          archive="$(find target/release-packages -name 'jscout-*.tar.gz' -print -quit)"
          mkdir "$RUNNER_TEMP/jscout-package"
          tar -xzf "$archive" -C "$RUNNER_TEMP/jscout-package"
          binary="$(find "$RUNNER_TEMP/jscout-package" -type f -name jscout -print -quit)"
          JSCOUT_PI_AI_OPENAI_COMPATIBLE_PROVIDERS='[{"id":"local","baseUrl":"http://127.0.0.1:11434/v1","models":[{"id":"smoke","contextWindow":131072,"maxTokens":32768}]}]' \
            "$binary" llm doctor --model local:smoke
          bundle_dir="$(dirname "$binary")"
          "$binary" checker doctor "$bundle_dir"
