[package]
name = "jscout"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
blake3 = "1.8.5"
clap = { version = "4.6.5", features = ["derive"] }
ignore = "0.4.33"
notify = "8.2.0"
oxc_allocator = "0.143.0"
oxc_ast = "0.143.0"
oxc_ast_visit = "0.143.0"
oxc_parser = "0.143.0"
oxc_resolver = "11.24.2"
oxc_semantic = "0.143.0"
oxc_span = "0.143.0"
oxc_syntax = "0.143.0"
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
ureq = "3.3.0"

[dev-dependencies]
tempfile = "3.23.0"
